[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-mvp"
version = "0.2.0"
description = "Multi-agent research orchestrator with mock and Patchright-backed ChatGPT web execution"
requires-python = ">=3.10"
dependencies = ["patchright==1.61.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
