name: P2 Evaluation Integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p2-evaluation-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch evaluator integration
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('orchestrator/src/orchestrator/core/orchestrator.py')
          source = path.read_text(encoding='utf-8')

          import_marker = 'from orchestrator.core.execution_gate import ExecutionGate\n'
          evaluation_import = 'from orchestrator.core.evaluation import TaskEvaluator\n'
          if evaluation_import not in source:
              if import_marker not in source:
                  raise SystemExit('execution_gate import marker not found')
              source = source.replace(import_marker, import_marker + evaluation_import, 1)

          init_marker = '        self.retry_policy = RetryPolicy()\n'
          evaluator_init = '        self.task_evaluator = TaskEvaluator()\n'
          if evaluator_init not in source:
              if init_marker not in source:
                  raise SystemExit('retry_policy init marker not found')
              source = source.replace(init_marker, init_marker + evaluator_init, 1)

          result_marker = '        raw_output = agent.process_result(result, full_context)\n'
          evaluation_block = '''        raw_output.metadata["execution_success"] = bool(result.success)\n        raw_output.metadata["agent_output_success"] = bool(raw_output.success)\n        task_evaluation = self.task_evaluator.evaluate(\n            raw_output,\n            full_context,\n            execution_success=bool(result.success),\n        )\n        raw_output.metadata["task_evaluation"] = task_evaluation.to_dict()\n'''
          if 'raw_output.metadata["task_evaluation"]' not in source:
              if result_marker not in source:
                  raise SystemExit('agent result marker not found')
              source = source.replace(result_marker, result_marker + evaluation_block, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Install package
        working-directory: orchestrator
        run: python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Run full regression suite
        working-directory: orchestrator
        run: python -m pytest -q
      - name: Compile package
        working-directory: orchestrator
        run: python -m compileall -q src
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orchestrator/src/orchestrator/core/orchestrator.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "P2: record independent task evaluation outcomes"
            git push origin HEAD:main
          fi
